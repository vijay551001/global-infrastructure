server {
    listen 80;
    server_name localhost;

    # 1. Task Manager Frontend
    location / {
        root /usr/share/nginx/html/tasks;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 2. Server Monitor Frontend
    location /monitor {
        alias /usr/share/nginx/html/monitor/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 3. Task Manager Backend API
    location /api/tasks {
        proxy_pass http://task-manager:5000/api/tasks;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Server Monitor Backend API
    location /api/logs {
        proxy_pass http://server-monitor:4000/api/logs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
