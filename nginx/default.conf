# --- Domain 1: Task Manager Routing ---
server {
    listen 80;
    server_name my-tasks.local;

    location / {
        root /usr/share/nginx/html/tasks;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api/tasks {
        proxy_pass http://task-manager:5000/api/tasks;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# --- Domain 2: Server Monitor Routing ---
server {
    listen 80;
    server_name server-monitor.local;

    location / {
        root /usr/share/nginx/html/monitor;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api/logs {
        proxy_pass http://server-monitor:4000/api/logs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
