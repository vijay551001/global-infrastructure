version: '3.8'

services:
  # --- Service 1: Task Manager Application ---
  task-manager:
    container_name: running-app
    image: task-manger-app
    ports:
      - "5000:5000"
    volumes:
      # Mounts the task manager backend to persist database.json on your host disk
      - ./my-new-app/backend:/app/backend
    restart: always

  # --- Service 2: Server Monitor Application ---
  server-monitor:
    container_name: running-monitor
    image: server-monitor-app
    ports:
      - "4000:4000"
    volumes:
      # Mounts the server monitor backend to persist health-log.json on your host disk
      - ./server-monitor-app/backend:/app/backend
    restart: always

