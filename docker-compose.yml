version: '3.8'

services:
  # --- Service 1: Task Manager Application ---
  task-manager:
    container_name: running-app
    image: task-manger-app
    # Note: We removed the public "ports:" flag array! The app is now protected
    # inside the private container network, accessible only through Nginx.
    volumes:
      - ./my-new-app/backend:/app/backend
    restart: always

  # --- Service 2: Server Monitor Application ---
  server-monitor:
    container_name: running-monitor
    image: server-monitor-app
    volumes:
      - ./server-monitor-app/backend:/app/backend
    restart: always

  # --- Service 3: Nginx Gateway Reverse Proxy ---
  reverse-proxy:
    container_name: running-proxy
    image: nginx:alpine
    ports:
      - "80:80" # Binds your physical computer's standard web port 80 to the network grid
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - task-manager
      - server-monitor
    restart: always
