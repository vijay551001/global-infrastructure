name: Continuous Integration & Image Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants the cloud runner permission to upload to your container registry

    steps:
      # Step 1: Clone the latest repository code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Set up virtual Docker compilation tools
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Securely sign into the GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Compile AND permanently upload the image to your profile registry
      - name: Build and Push Server Monitor Image
        uses: docker/build-push-action@v6
        with:
          context: ./server-monitor-app
          file: ./server-monitor-app/Dockerfile
          push: true # Tells the runner to upload it live
          tags: ghcr.io/vijay551001/server-monitor-app:latest
